name: Manual Tidal-to-Spotify favorites sync

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-tidal-manual-favorites-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REDIRECT_URI: http://127.0.0.1:8888/callback
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      SPOTIFY_NONINTERACTIVE: '1'
      TIDAL_TOKEN_TYPE: Bearer
      TIDAL_ACCESS_TOKEN: ${{ secrets.TIDAL_ACCESS_TOKEN }}
      TIDAL_REFRESH_TOKEN: ${{ secrets.TIDAL_REFRESH_TOKEN }}
      TIDAL_NONINTERACTIVE: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Run first validated Tidal-to-Spotify favorites sync
        run: >-
          python -m spotify_to_tidal
          --config example_config.yml
          --sync-favorites
          --sync-direction tidal_to_spotify
